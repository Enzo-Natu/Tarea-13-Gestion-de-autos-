<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Automotora | Vehículos</title>
    <link rel="stylesheet" href="dist/css/styles.css">
</head>
<body>
    <header class="encabezado">
        <a class="marca-sitio" href="index.html">AUTOMOTORA</a>
        <a class="boton" href="dist/paginas/agregar.html">Agregar auto</a>
    </header>
    <main class="contenedor">
        <section class="intro">
            <p class="etiqueta">INVENTARIO</p>
            <h1>Vehículos disponibles</h1>
            <p>Consultá los autos registrados en nuestra automotora.</p>
        </section>
        <p id="mensaje" class="mensaje"></p>
        <div class="tabla-contenedor">
            <table>
                <thead>
                    <tr>
                        <th>Marca</th>
                        <th>Modelo</th>
                        <th>Año</th>
                        <th>Precio</th>
                        <th>Estado</th>
                        <th>Información</th>
                    </tr>
                </thead>
                <tbody id="lista-vehiculos">
                    <tr><td colspan="6">Cargando vehículos...</td></tr>
                </tbody>
            </table>
        </div>
    </main>
    <script src="dist/js/app.js"></script>

</html>
