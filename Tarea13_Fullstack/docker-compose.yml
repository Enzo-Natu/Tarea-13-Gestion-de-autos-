services:
  web:
    build: .
    container_name: tarea13_web
    ports:
      - "8080:80"
    environment:
      DB_HOST: ${DB_HOST:-db}
      DB_NAME: ${DB_NAME:-automotora}
      DB_USER: ${DB_USER:-root}
      DB_PASS: ${DB_PASS:-root}
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.0
    container_name: tarea13_db
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-root}
      MYSQL_DATABASE: ${DB_NAME:-automotora}
    ports:
      - "3307:3306"
    volumes:
      - datos_mysql:/var/lib/mysql
      - ./api/Config/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASS:-root}"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  datos_mysql:
